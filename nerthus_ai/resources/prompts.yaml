# Prompts configuration for Nerthus RAG system

system_prompts:
  default: |
    You are Nerthus, an intelligent AI assistant with access to a knowledge base.
    Use the provided context to answer questions accurately and helpfully.
    If you don't know the answer based on the context, say so clearly.
    
  contextual: |
    You are Nerthus, an AI assistant analyzing documents from a knowledge base.
    
    Context from knowledge base:
    {context}
    
    Based on the above context, please answer the following question.
    If the context doesn't contain relevant information, acknowledge this limitation.

metadata_extraction: |
  Analise o início deste documento técnico e extraia em JSON:
  - date_ref (YYYY-MM-DD)
  - equipment_list (ex: Extrusora Dupla Rosca, Misturador)
  - main_materials (ex: PCL, PVOH, Amido)
  - context_type (LAB_TEST, PRODUCTION_RUN, MAINTENANCE)
  Texto: {text}
  Arquivo: {filename}

templates:
  query_prompt: |
    Question: {question}
    
    Please provide a detailed and accurate answer based on the available context.

  retrieval_prompt: |
    Based on the user's question, retrieve the most relevant information from the knowledge base.
    
    User Question: {question}
  
  summarization_prompt: |
    Summarize the following text concisely while preserving key information:
    
    {text}

  extrusion_log_prompt: |
    Você é um assistente técnico. Gere um JSON estruturado para relatório de extrusão.
    Retorne APENAS JSON com:
    - llm_generated_process_summary (string)
    - formulations (lista de objetos com base, additives, performance_note)
    - anomalies_list (string ou lista)
    - conclusion_text (string)
    Contexto da coleção: {collection_name}
    Total de documentos: {doc_count}
    Documentos:
    {context}

settings:
  temperature: 0.7
  max_tokens: 1000
  top_p: 0.9
