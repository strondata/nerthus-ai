[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerthus-ai"
version = "0.1.0"
description = "RAG-powered AI library and CLI for the Nerthus ecosystem"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Strondata" }]
requires-python = ">=3.8"
dependencies = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.20",
    "chromadb>=0.4.22",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "pypdf>=3.17.4",
    "python-docx>=1.1.0",
    "streamlit>=1.32.0",
]

[project.scripts]
nerthus = "nerthus_ai.cli.commands:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["nerthus_ai*"]

[tool.setuptools.package-data]
nerthus_ai = [
    "resources/prompts.yaml",
    "resources/templates/*.md",
    "ui/templates/*.html",
]
